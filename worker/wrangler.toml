name = "control-peso-sync"
main = "index.js"
compatibility_date = "2024-11-01"

# Base de datos (D1, gratis) con los datos cifrados de cada usuario.
# Se crea con:  npx wrangler d1 create control-peso-sync
# y la tabla con:  npx wrangler d1 execute control-peso-sync --remote --file schema.sql
[[d1_databases]]
binding = "SYNC"
database_name = "control-peso-sync"
database_id = "cd37e042-130d-4823-a5b5-15e8f4fb65c9"
